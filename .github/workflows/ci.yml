name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cross-platform-quality:
    name: Quality (${{ matrix.os }}, Python 3.14)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked development environment
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uvx ty check

      - name: Run fast tests with coverage (Linux)
        if: runner.os == 'Linux'
        env:
          PYTHONUTF8: "1"
        run: >-
          uv run pytest
          tests/test_app_helpers.py tests/test_guard_edges.py tests/test_guard_worktrees.py
          tests/test_identity.py tests/test_security_path_traversal.py
          tests/test_attachments_extended.py tests/test_image_processing_edge.py
          tests/test_toon_encoder_identification.py tests/test_share_export.py
          tests/test_cli_stub.py -q --tb=short

      - name: Run fast tests (Windows)
        if: runner.os == 'Windows'
        env:
          PYTHONUTF8: "1"
        run: >-
          uv run pytest
          tests/test_app_helpers.py tests/test_guard_edges.py tests/test_guard_worktrees.py
          tests/test_identity.py tests/test_security_path_traversal.py
          tests/test_attachments_extended.py tests/test_image_processing_edge.py
          tests/test_toon_encoder_identification.py tests/test_share_export.py
          tests/test_cli_stub.py -q --no-cov --tb=short

      - name: Smoke test am-run (Linux)
        if: runner.os == 'Linux'
        run: uv run python -m mcp_agent_mail.cli am-run ci-slot -- echo "ok"

  functional-tests:
    name: Complete functional tests (Linux, Python 3.14)
    needs: cross-platform-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked development environment
        run: uv sync --locked --dev

      - name: Run complete non-performance suite
        env:
          PYTHONUTF8: "1"
        run: uv run pytest -m "not benchmark and not ci_regression" -q --tb=short

  performance:
    name: Performance regression tests (Linux, Python 3.14)
    needs: [cross-platform-quality, functional-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked development environment
        run: uv sync --locked --dev

      - name: Run performance benchmarks
        env:
          PYTHONUTF8: "1"
          RUN_BENCHMARKS: "1"
          INSTRUMENTATION_ENABLED: "true"
        run: uv run pytest tests/benchmarks/ -v -m benchmark --no-cov --tb=short

      - name: Run CI performance regression checks
        env:
          PYTHONUTF8: "1"
        run: uv run pytest tests/benchmarks/test_ci_regression.py -v -m ci_regression --no-cov --tb=short

      - name: Upload regression report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-reports-py3.14
          path: tests/benchmarks/regression_reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload benchmark results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-py3.14
          path: tests/benchmarks/results/
          if-no-files-found: ignore
          retention-days: 30
